# Temporal Cloud action-spike alert rules for Grafana (unified alerting).
#
# This is a provisioning file, not a dashboard - it is imported separately from
# temporal_cloud_action_costs.json. 
#
# Instructions:
# 1. Replace every PROM_DS_UID placeholder with your own Prometheus data source's UID (find it under Connections -> Data sources -> [your source] -> Settings - it's in the page URL 
# and in the data source's JSON model).
# 2. Load the file into Grafana. 
# 3. Create a contact point (Slack webhook, email, PagerDuty, etc.) in Alerting -> Contact points, and a notification policy that routes alerts labeled category: 
# temporal-cost to it. The rules intentionally don't hardcode a contact point, since that's specific to your team.
# 
# Rules included
# Action rate spike vs 24h ago: Fires when current action rate is >50% above the same time yesterday, sustained for 10 min
# Action rate spike vs 7d ago: Fires when current action rate is >75% above the same time last week, sustained for 10 min
#
# Before use, replace every occurrence of PROM_DS_UID below with the UID of your
# own Prometheus data source (Connections > Data sources > your source > Settings).
#
# The thresholds here (50%, 75%, 80%) are reasonable starting points, not tuned to
# any specific account. A namespace with naturally spiky, low-volume traffic will
# trip the 24h/7d rules on ordinary variance; a very high, steady-volume namespace
# may want tighter thresholds to catch smaller-but-still-costly increases. Watch
# these for a week or two after setup and adjust the "params" values to match your
# own traffic pattern.

apiVersion: 1

groups:
  - orgId: 1
    name: temporal-cloud-action-spikes
    folder: Temporal Cloud
    interval: 5m
    rules:
      - uid: tcloud-action-spike-24h
        title: Temporal Cloud - action rate spike vs 24h ago
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          category: temporal-cost
          severity: warning
        annotations:
          summary: "Action rate is {{ $values.A }}% higher than the same time yesterday."
          description: >
            Current Temporal Cloud action rate has moved more than 50% away from
            the same time 24 hours ago. This usually means a deploy, new workflow
            type, or bug started driving a lot more billable Actions than usual.
            Check the "Billable Action Rate by Workflow Type" panel on the
            Actions MTD & Spike Detection dashboard to see which Workflow Type
            is responsible.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROM_DS_UID
            model:
              editorMode: code
              expr: >-
                (sum(temporal_cloud_v1_total_action_count{temporal_namespace=~".*"})
                - sum(temporal_cloud_v1_total_action_count{temporal_namespace=~".*"} offset 1d))
                / clamp_min(sum(temporal_cloud_v1_total_action_count{temporal_namespace=~".*"} offset 1d), 1e-9) * 100
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                # Percent-change threshold - tune to your own traffic pattern (see note above).
                - evaluator:
                    type: gt
                    params: [50]
              refId: C

      - uid: tcloud-action-spike-7d
        title: Temporal Cloud - action rate spike vs 7d ago
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          category: temporal-cost
          severity: warning
        annotations:
          summary: "Action rate is {{ $values.A }}% higher than the same time last week."
          description: >
            Current Temporal Cloud action rate has moved more than 75% away from
            the same time 7 days ago. Week-over-week naturally varies more than
            day-over-day, so this threshold is looser than the 24h rule - treat
            it as a slower-moving confirmation of a sustained usage change
            rather than a same-day spike.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROM_DS_UID
            model:
              editorMode: code
              expr: >-
                (sum(temporal_cloud_v1_total_action_count{temporal_namespace=~".*"})
                - sum(temporal_cloud_v1_total_action_count{temporal_namespace=~".*"} offset 7d))
                / sum(temporal_cloud_v1_total_action_count{temporal_namespace=~".*"} offset 7d) * 100
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [75]
              refId: C